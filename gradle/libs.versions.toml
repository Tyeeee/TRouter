[versions]
agp = "9.3.2"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activity = "1.8.0"   # androidx.activity（页面基类 ComponentActivity 的来源）
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
fragment = "1.8.9"
androidxTestCore = "1.6.1"
androidxTestRules = "1.6.1"
# 批次 A2：Lint 检查模块（版本必须与 AGP 9.3.2 的 Lint 线一致：AGP 9.3.2 ↔ 32.3.2）
lint = "32.3.2"
# 自己的日志库 TLogger（TRouter 的默认日志通道；消费方用同一个坐标，日志自然合成一条线）
tlogger = "0.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
ksp-api = { group = "com.google.devtools.ksp", name = "symbol-processing-api", version.ref = "ksp" }
androidx-fragment = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
lint-api = { group = "com.android.tools.lint", name = "lint-api", version.ref = "lint" }
lint-tests = { group = "com.android.tools.lint", name = "lint-tests", version.ref = "lint" }

# 自己的日志库（与 TScaffold 同一套坐标；TRouter 内部日志也走它）
tlogger-core = { group = "io.github.tyeeee", name = "tlogger-core", version.ref = "tlogger" }
tlogger-android = { group = "io.github.tyeeee", name = "tlogger-android", version.ref = "tlogger" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
